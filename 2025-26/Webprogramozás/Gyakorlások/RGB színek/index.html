<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RGB színek</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <style>
        td{
            width: 1px;
            height: 1px;
            padding: 0;
            margin: 0;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <header class="col-12">
                <h1 class="text-center">RGB színek, 2023. 05. 22.</h1>
            </header>
            <div class="col-12 container">
                <div class="row">
                    <div class="col-8">
                        <h2 class="text-center">A kép</h2>
                        <div id="kep">
                            <table></table>
                        </div>
                    </div>
                    <div class="col-4 container">
                        <div class="row">
                            <div class="col-12">
                                <h2>1. feladat</h2>
                                <div class="text-center"><button class="btn btn-info" type="button" onclick="f1()">Keres</button></div>
                            </div>
                            <div class="col-12">
                                <h2>2. feladat</h2>
                                <div>
                                    <label for="sorszam">Sor száma: </label>
                                    <input type="number" id="sorszam" min="1" max="360" class="form-control"/>
                                </div>
                                <div>
                                    <label for="sorszam">Oszlop száma: </label>
                                    <input type="number" id="oszlopszam" min="1" max="640" class="form-control"/>
                                </div>
                                <div>Eredmény: <span id="f2-eredmeny"></span></div>
                                <div class="text-center"><button class="btn btn-info" type="button" onclick="f2()">Keres</button></div>
                                <div class="col-12">
                                    <h2>3. feladat</h2>
                                    <div>Világos pixelek száma: <span id="f3-eredmeny"></span></div>
                                    <div class="text-center"><button class="btn btn-info" type="button" onclick="f3()">Keres</button></div>
                                <div class="col-12">
                                    <h2>4. feladat</h2>
                                    <div>Legsötétebb pixelek összege: <span id="f4-eredmeny"></span></div>
                                    <div>Legsötétebb pixelek listája: <span id="f4-lista"></span></div>
                                <div class="text-center"><button class="btn btn-info" type="button" onclick="f4()">Keres</button></div>
                            </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <footer class="col-12 text-center">
                RTomi05, Nagyatád, 2026. 03. 18.
            </footer>
        </div>
    </div>
    <script>
        const kepAdat = [];

        f1();
        function f1()
        {
            fetch("kep.txt")
            .then(x => x.text())
            .then(x => {
                //console.log(x);
                const sorok = x.trim().split("\r\n");
                sorok.forEach((sor, index) => {
                    kepAdat.push([]);
                    let tablaSor = document.createElement("tr");
                    const adatok = sor.split(" ");
                    for(let i = 0; i < adatok.length; i+=3)
                    {
                        let pixel = {
                            r: parseInt(adatok[i]),
                            g: parseInt(adatok[i+1]),
                            b: parseInt(adatok[i+2]),
                            RGB: "RGB("
                            +adatok[i]
                            +","
                            +adatok[i+1]
                            +","
                            +adatok[i+2]
                            +")",
                            x: i/3,
                            y: index,

                        };

                        let cella = document.createElement("td");
                        cella.style.backgroundColor = pixel.RGB;
                        pixel["cella"] = cella;
                        tablaSor.appendChild(cella);

                        pixel["RGBSum"] = pixel.r + pixel.g + pixel.b;

                        kepAdat[kepAdat.length - 1].push(pixel);
                    }

                    document.querySelector("#kep table").appendChild(tablaSor);
                });
                console.log(sorok);
                //console.log(kepAdat);
            });
        }

        function f2()
        {
            let sor = parseInt(document.getElementById("sorszam").value) ?? 1;
            let oszlop = parseInt(document.getElementById("oszlopszam").value) ?? 1;

            kepAdat[sor - 1][oszlop - 1].cella.style.backgroundColor = "yellow";
            document.getElementById("f2-eredmeny").innerHTML = kepAdat[sor - 1][oszlop - 1].RGB;
        }

        function f3()
        {
            const vilagos = kepAdat.flat().filter(x => x.RGBSum > 600);

            document.getElementById("f3-eredmeny").innerHTML = vilagos.length;
        }

        function f4()
        {
            let min = 1000;
            kepAdat.flat().forEach(x => {
                if(x.RGBSum < min) min = x.RGBSum;
            });
            document.getElementById("f4-eredmeny").innerHTML = min;

            const sotet = [];
            kepAdat.flat().forEach(e =>
                {
                    if (e.RGBSum == min)
                    {
                        sotet.push(e);
                        console.log(e);
                        keretKeszit(e);
                    }
                }
            );

            /*
            let szoveg = `
            <ol>
                <li>asdasd</li>
                <li>asdasd</li>
                <li>asdasd</li>
            </ol>`;
            */
            let szoveg = "<ol>";
            sotet.forEach(x => {
                szoveg += `<li>${x.RGB}</li>`;
            });
            szoveg += "</ol>";
            document.getElementById("f4-lista").innerHTML = szoveg;
            
        }

        function keretKeszit(e)
        {
        console.log("képpont:" + e.x, e.y);
            if(kepAdat[e.y-1] != undefined && kepAdat[e.y-1][e.x-1] != undefined) kepAdat[e.y-1][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y-1] != undefined && kepAdat[e.y-1][e.x-1] != undefined) kepAdat[e.y-1][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y-1] != undefined && kepAdat[e.y-1][e.x-1] != undefined) kepAdat[e.y-1][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y] != undefined && kepAdat[e.y][e.x-1] != undefined) kepAdat[e.y][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y] != undefined && kepAdat[e.y][e.x-1] != undefined) kepAdat[e.y][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y] != undefined && kepAdat[e.y][e.x-1] != undefined) kepAdat[e.y][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y+1] != undefined && kepAdat[e.y+1][e.x-1] != undefined) kepAdat[e.y+1][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y+1] != undefined && kepAdat[e.y+1][e.x-1] != undefined) kepAdat[e.y+1][e.x-1].cella.backgroundColor = "yellow";
            if(kepAdat[e.y+1] != undefined && kepAdat[e.y+1][e.x-1] != undefined) kepAdat[e.y+1][e.x-1].cella.backgroundColor = "yellow";
        };
        
    </script>
</body>
</html>
