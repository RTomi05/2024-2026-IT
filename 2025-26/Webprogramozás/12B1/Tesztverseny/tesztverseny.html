<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        .valaszJelolo
        {
            height: 25px;
            width: 25px;
            box-sizing: content-box;
        }

    </style>
    <title>Tesztverseny</title>
</head>
<body onload="betolt()">
    <div class="container">
        <div class="row">
            <header class="col-12"><h1 class="text-center">Tesztverseny</h1></header>
        </div>
        <div class="row">
            <div class="col-6">
                <h2 class="text-primary">2. feladat</h2>
                <p>A vetélkedőn <span class="text-success fw-bold" id="f2"></span> versenyző indult.</p>
            </div>
            <div class="col-6">
                <h2 class="text-primary">3. feladat</h2>
                <label for="azonosito">Adja meg a versenyző azonosítóját:</label>
                <input type="text" name="" id="azonosito" value="AB123" class="form-control" placeholder="AB123">
                <div class="text-center p-3"><button class="btn btn-info" onclick="f3()">Lekérés</button></div>
                <div id="eredmeny" class="border"></div>
                <h3>A helyes megoldás:</h3>
                <div id="helyes" class="border"></div>
            </div>
            <div class="col-6">
                <h2 class="text-primary">5. feladat</h2>
                <label for="azonosito">Adja meg a feladat sorszámát:</label>
                <input type="number" min="1" max="14" name="" id="feladatSorszam" value="10" class="form-control">
                <div class="text-center p-3"><button class="btn btn-info" onclick="f5()">Lekérés</button></div>
                <div id="eredmeny5" class="border">
                    <p>A feladatra <span></span> fő, a versenyzők <span></span>%-a adott helyes választ.</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        let adatok = [];
        let helyesValasz = "";
        function betolt()
        {
            fetch("valaszok.txt")
            .then(x => x.text())
            .then(y => 
                {
                    adatok = y.replaceAll("\r", "").trim().split("\n");
                    helyesValasz = adatok.shift();

                    adatok = adatok.map(x =>
                    {
                        const vag = x.split(" ");
                        return {kod:vag[0],valaszok:vag[1]}
                    })
                    console.log(adatok);
                    f2();
                }
            )
        }

        function f2()
        {
            let eredmeny = adatok.length;
            document.getElementById("f2").innerHTML = eredmeny;
        }

        function f3()
        {
            //console.log("haho");
            const kod = document.getElementById("azonosito").value.toUpperCase();
            let versenyzoAdat = adatok.filter(x => x.kod == kod);
            console.log(versenyzoAdat);
            if(versenyzoAdat.length == 0)
            {
                return;
            }
            document.getElementById("eredmeny").innerHTML = "";
            document.getElementById("eredmeny").appendChild(valaszMegjelenit(versenyzoAdat[0].valaszok,true));
            document.getElementById("helyes").innerHTML = "";
            document.getElementById("helyes").appendChild(valaszMegjelenit(helyesValasz));
        }

        function valaszMegjelenit(valaszok, javitasKell = false)
        {
            
            let gyujto = document.createElement("div");
            console.log(valaszok);
            valaszok.split("").forEach((e,index) => {
                let elem = document.createElement("div");
                elem.classList.add("valaszJelolo");
                elem.classList.add("d-inline-block");
                elem.classList.add("text-white");
                elem.classList.add("text-center");
                if(javitasKell)
                {
                    if(e != helyesValasz[index])
                    {
                        /*
                        elem.classList.add("border")
                        elem.classList.add("border-danger")
                        elem.classList.add("border-1")
                        */
                       elem.classList.add("bg-danger")
                    }
                }
                switch(e)
                {
                    case "A":
                        elem.classList.add("bg-primary")
                        break;
                    case "B":
                        elem.classList.add("bg-info")
                        break;
                    case "C":
                        elem.classList.add("bg-warning")
                        break;
                    case "D":
                        elem.classList.add("bg-success")
                        break;
                    case "X":
                        elem.classList.add("bg-secondary")
                        break;                  
                }
                elem.innerHTML = e;
                gyujto.appendChild(elem);
                
                
            });
            return gyujto;
        }

        function f5()
        {
            const feladatSzam = parseInt(document.getElementById("feladatSorszam").value)-1;
            //console.log(feladatSzam);
            const szurt = adatok.filter(x => x.valaszok[feladatSzam] == helyesValasz[feladatSzam])
            console.log(szurt);
        }
    </script>
</body>
</html>
