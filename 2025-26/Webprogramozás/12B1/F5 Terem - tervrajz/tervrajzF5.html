<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F5 terem alaprajz</title>
    <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-lg-6">
                <h1>F5 terem alaprajz</h1>
                <canvas>
                    <script>
                        $(document).ready(function() {
                            var canvas = document.querySelector("canvas");
                            var ctx = canvas.getContext("2d");
                            canvas.width = 1000;
                            canvas.height = 750;

                            ctx.fillStyle = "lightblue";
                            ctx.fillRect(0, 0, canvas.width, canvas.height);

                            //asztalok
                            ctx.fillStyle = "sandybrown";
                            ctx.fillRect(50, 50, 200, 70);
                            ctx.fillRect(260, 50, 200, 70);
                            ctx.fillRect(50, 200, 200, 70);
                            //tanári asztal
                            ctx.fillRect(470, 200, 200, 70);

                            //gépek
                            ctx.fillStyle = "black";
                            ctx.fillRect(70, 55, 60, 50);
                            ctx.fillRect(170, 55, 60, 50);

                            //szöveg
                            ctx.fillStyle = "white";
                            ctx.font = "40px Arial";
                            ctx.fillText("1", 90, 95);
                            ctx.fillText("2", 190, 95);
                            ctx.fillStyle = "black";
                            ctx.font = "20px Arial";
                            ctx.fillText("minden más", 300, 90);
                            ctx.fillText("tanári asztal", 520, 240);
                        });
                    </script>
                </canvas>
            </div>
        </div>
    </div>
    
</body>
</html>
