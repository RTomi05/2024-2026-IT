    <button onclick="ido()">Idő frissítése</button>
    <div id="idokiiras"></div>
    <script>
        // III. Készítsetek egy oldalt, ami betöltéskor megjeleníti az akkori aktuális időt. Legyen az oldalon egy gomb, amit megnyomva az idő frissül.
        function ido()
        {
        const ujIdo = new Date();
        document.getElementById("idokiiras").innerHTML = ujIdo.toLocaleTimeString();
        }
        </script>

    <br>
    <script>
        document.write(a + " + " + b + " = " + osszeg + "<br />")

        document.write("Befogók: " + a + ", " + b + " => Átfogó: " + c + "<br/>")

        // VI. Kérjetek be egy távolság értéket centiméterben, és jelenítsétek meg méterre átváltva.

        function atvalt()
        {
            let ertekCm = prompt("Adj meg egy távolságot centiméterben: ")
            let ertekM = ertekCm * 0.01
            document.getElementById("atvaltott").innerHTML = ertekCm + " cm átváltva méterbe: " + ertekM + " m";

        }

        </script>
        <button onclick="legkisebb()">Legkisebb számítás</button>
        <div id="legkisebbHelye"></div>
        <script>

        // X. Készítsetek egy programot, amely bekér 5 számot, és kiírja hogy melyik a legkisebb.
        function legkisebb()
        {
            let legkisebbTomb = [];
            for (let i = 0; i < 5; i++)
            {
                let talanLegkisebb = prompt("Adj meg egy egész számot: ");
                legkisebbTomb.push(Number(talanLegkisebb));
            }
            let legkisebb = Math.min(...legkisebbTomb);
            document.getElementById("legkisebbHelye").innerHTML = "A megadott számok: " + legkisebbTomb + "<br>" + "A legkisebb szám: " + legkisebb;
        }

    </script>
