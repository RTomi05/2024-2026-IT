<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tetrominó Torpedó</title>
     <style>
        .cella
        {
            width: 20px;
            height: 20px;
            border: 1px solid black;
        }
    </style>

</head>
<body onload="init()">
    <h1>Tetrominó Torpedó</h1>
    <table id="jatekter"></table>
   
    <script>
        class urhajo
        {
            constructor(tipus, szin, forgatas, x, y)
            {
                const alakok = [
                    [{x:0, y:0}, {x:1, y:0}, {x:2, y:0}, {x:3, y:0}],
                    [{x:0, y:0}, {x:1, y:0}, {x:0, y:1}, {x:1, y:1}],
                    [{x:0, y:1}, {x:1, y:1}, {x:1, y:0}, {x:2, y:1}],
                    [{x:0, y:0}, {x:1, y:0}, {x:2, y:0}, {x:2, y:1}],
                    [{x:0, y:1}, {x:1, y:1}, {x:2, y:1}, {x:2, y:0}],
                    [{x:0, y:1}, {x:1, y:1}, {x:1, y:0}, {x:2, y:0}],
                    [{x:0, y:0}, {x:1, y:0}, {x:1, y:1}, {x:2, y:1}]
                ];

                this.tipus = tipus;
                this.szin = szin;
                this.forgatas = forgatas;
                //koordináták
                this.x = x;
                this.y = y;

                this.elemek = alakok[tipus];
            }

            forgat()
            {
                
            }
        }
        const meret = {
            "sor": 12,
            "oszlop": 12
        };

        const tabla = [];

        function init()
        {
            jatekter();
        }

        function jatekter()
        {
            for (let i = 0; i < meret.sor; i++)
            {
                let sor = document.createElement("tr");
                sor.id = "sor" + i;
                sor.dataset["sor"] = i;
                //data-sor = "1"
                tabla[i] = [];
                for (let k = 0; k < meret.oszlop; k++)
                {
                    let cella = document.createElement("td");
                    cella.id = "cella" + i + "-" + k;
                    cella.dataset["x"] = k;
                    cella.dataset["y"] = i;
                    cella.onclick = function() {szonda(this);};
                    cella.classList.add("cella");

                    tabla[i][k] = cella;
                    sor.appendChild(cella);
                }

                document.getElementById("jatekter").appendChild(sor);
            }
        }

        function szonda(elem)
        {
            console.log(elem);
        }
    </script>
</body>
</html>
